name: FX 매수 시그널 텔레그램 알림

on:
  schedule:
    # 10분마다 실행 시도 (GitHub 무료 플랜은 실제로 10~20분 간격으로 지연될 수 있음)
    - cron: "*/10 * * * *"
  # Actions 탭에서 수동으로 즉시 실행해 테스트할 수 있게 함
  workflow_dispatch:

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요 패키지 설치
        run: pip install yfinance pandas numpy requests

      - name: 시그널 확인 및 알림 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_alert.py
